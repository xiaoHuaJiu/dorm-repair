<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录与注册 · 宿修通</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="login-page"><section class="login-visual"><div class="brand"><span class="brand-mark">修</span><span>宿修通</span></div><div class="login-copy"><span>宿舍报修与维修工单系统</span><h1>每一张工单，都有清楚的去向。</h1><p>从学生提交报修，到维修人员处理，再到管理员兜底，全程状态、负责人和关键时间均可追溯。</p></div><div class="login-flow"><span>提交报修</span><b>→</b><span>自动派单</span><b>→</b><span>维修处理</span><b>→</b><span>确认评价</span></div></section><section class="login-panel"><div class="login-box"><div class="auth-tabs" role="tablist" aria-label="账号入口"><button class="auth-tab active" id="login-tab" role="tab" aria-selected="true" data-auth-view="login">登录</button><button class="auth-tab" id="register-tab" role="tab" aria-selected="false" data-auth-view="register">学生注册</button></div><section id="login-view" role="tabpanel" aria-labelledby="login-tab"><h2>登录系统</h2><p class="muted">选择演示账号，或使用已注册的学生账号。</p><div class="account-grid"><button class="account" data-account="student"><strong>林同学</strong><span>学生 student</span></button><button class="account" data-account="worker"><strong>张师傅</strong><span>维修 worker</span></button><button class="account" data-account="admin"><strong>王老师</strong><span>管理员 admin</span></button></div><div class="notice green hidden" id="register-success" role="status"></div><form class="form" id="login-form"><div class="field"><label for="username">账号</label><input class="input" id="username" autocomplete="username" value="student"></div><div class="field"><label for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password" value="123456"></div><div id="login-error" class="error" role="alert"></div><button class="btn primary" type="submit">登录</button><p class="hint">演示密码统一为 123456，仅保存于当前浏览器。</p></form></section><section id="register-view" class="hidden" role="tabpanel" aria-labelledby="register-tab"><h2>注册学生账号</h2><p class="muted">仅开放学生注册，账号角色固定为 STUDENT。</p><form class="form" id="register-form"><div class="field"><label class="required" for="register-username">用户名</label><input class="input" id="register-username" autocomplete="username"></div><div class="grid two"><div class="field"><label class="required" for="register-password">密码</label><input class="input" id="register-password" type="password" autocomplete="new-password"></div><div class="field"><label class="required" for="register-confirm-password">确认密码</label><input class="input" id="register-confirm-password" type="password" autocomplete="new-password"></div></div><div class="field"><label class="required" for="register-real-name">真实姓名</label><input class="input" id="register-real-name"></div><div class="field"><label class="required" for="register-phone">手机号</label><input class="input" id="register-phone" inputmode="tel" autocomplete="tel"></div><div id="register-error" class="error" role="alert"></div><button class="btn primary" type="submit">注册学生账号</button></form></section></div></section></main><script src="assets/data.js"></script><script src="assets/app.js"></script><script>const views={login:document.getElementById('login-view'),register:document.getElementById('register-view')};function showAuth(name){Object.entries(views).forEach(([key,view])=>view.classList.toggle('hidden',key!==name));document.querySelectorAll('[data-auth-view]').forEach(button=>{const active=button.dataset.authView===name;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));});}document.querySelectorAll('[data-auth-view]').forEach(button=>button.onclick=()=>showAuth(button.dataset.authView));document.querySelectorAll('[data-account]').forEach(button=>button.onclick=()=>username.value=button.dataset.account);document.getElementById('login-form').onsubmit=event=>{event.preventDefault();const result=DormRepairApp.login(username.value,password.value);if(!result.ok){document.getElementById('login-error').textContent=result.message;return}location.href=result.data.role==='student'?'student-home.html':result.data.role==='worker'?'worker-home.html':'admin-dashboard.html'};document.getElementById('register-form').onsubmit=event=>{event.preventDefault();const result=DormRepairApp.actions.registerStudent({username:document.getElementById('register-username').value,password:document.getElementById('register-password').value,confirmPassword:document.getElementById('register-confirm-password').value,realName:document.getElementById('register-real-name').value,phone:document.getElementById('register-phone').value});if(!result.ok){document.getElementById('register-error').textContent=result.message;return}event.currentTarget.reset();document.getElementById('register-error').textContent='';document.getElementById('register-success').textContent=result.message;document.getElementById('register-success').classList.remove('hidden');showAuth('login');};</script></body></html>
