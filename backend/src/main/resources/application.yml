server:
  port: 8811

spring:
  application:
    name: dorm-repair-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dorm_repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:dorm_repair}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:200MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:210MB}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:8h}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:false}
    admin:
      username: ${DEV_ADMIN_USERNAME:}
      password: ${DEV_ADMIN_PASSWORD:}
    worker:
      username: ${DEV_WORKER_USERNAME:}
      password: ${DEV_WORKER_PASSWORD:}
    student:
      username: ${DEV_STUDENT_USERNAME:}
      password: ${DEV_STUDENT_PASSWORD:}
    disabled:
      username: ${DEV_DISABLED_USERNAME:}
      password: ${DEV_DISABLED_PASSWORD:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket-name: ${MINIO_BUCKET_NAME:repair-files}
    preview-expiry-seconds: ${MINIO_PREVIEW_EXPIRY_SECONDS:1800}
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  file-upload:
    image-max-size: ${FILE_IMAGE_MAX_BYTES:10485760}
    video-max-size: ${FILE_VIDEO_MAX_BYTES:209715200}
    image-extensions: [jpg,jpeg,png,webp]
    video-extensions: [mp4,mov,webm]
    image-mime-types: [image/jpeg,image/png,image/webp]
    video-mime-types: [video/mp4,video/quicktime,video/webm]
    orphan-retention: ${FILE_ORPHAN_RETENTION:24h}
    cleanup-batch-size: ${FILE_CLEANUP_BATCH_SIZE:100}
  dispatch:
    core-pool-size: ${DISPATCH_CORE_POOL_SIZE:2}
    max-pool-size: ${DISPATCH_MAX_POOL_SIZE:4}
    queue-capacity: ${DISPATCH_QUEUE_CAPACITY:200}
    recovery-delay-ms: ${DISPATCH_RECOVERY_DELAY_MS:60000}
    recovery-initial-delay-ms: ${DISPATCH_RECOVERY_INITIAL_DELAY_MS:60000}
    recovery-batch-size: ${DISPATCH_RECOVERY_BATCH_SIZE:100}
    stale-minutes: ${DISPATCH_STALE_MINUTES:1}
