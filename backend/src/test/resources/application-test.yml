spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:dorm_repair_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: test-only-secret-key-with-at-least-32-bytes
    ttl: 1h
  minio:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket-name: dorm-repair-test
    auto-create-bucket: false
  file-upload:
    cleanup-enabled: false

pagehelper:
  helper-dialect: h2
  reasonable: false
